# /etc/nginx/sites-available/2535cjzok-staging
# prod 설정(2535cjzok)은 건드리지 말고, 이 파일을 별도로 추가한다.

# 응답시간을 남기는 로그 형식. 이게 병목 위치를 가르는 핵심 단서다:
#   rt  = nginx가 요청을 받고 응답을 끝낼 때까지 전체 시간 (사용자가 느끼는 시간에 가장 가까움)
#   urt = 그중 gunicorn(Django)이 응답한 시간
#   rt - urt 가 크다 -> nginx/네트워크/클라이언트 쪽, urt 자체가 크다 -> Django/DB 쪽 문제.
log_format staging_timing '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                          'rt=$request_time urt=$upstream_response_time';

server {
    listen 80;
    server_name staging.your-domain.com;  # <- 실제 staging 서브도메인으로 바꾸기

    access_log /var/log/nginx/2535cjzok-staging.access.log staging_timing;

    client_max_body_size 10M;

    location /media/ {
        alias /home/ubuntu/2535cjzok/staging-data/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# HTTPS는 `sudo certbot --nginx -d staging.your-domain.com`이 이 파일에 자동으로 추가해준다.
