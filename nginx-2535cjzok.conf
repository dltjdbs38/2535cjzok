# /etc/nginx/sites-available/2535cjzok
# 이 파일을 서버에 만든 다음, 실제 도메인으로 server_name만 바꿔서 쓰면 됨.

server {
    listen 80;
    server_name your-domain.com;  # <- 여기 실제 도메인으로 바꾸기

    client_max_body_size 10M;  # 사진 업로드 용량 제한 (필요하면 조정)

    # 업로드된 사진(프사/얼굴/전신/취향사진/채팅사진 등)은 nginx가 디스크에서 직접 서빙한다.
    # (DEBUG=False일 땐 Django가 media를 직접 서빙 안 하므로 이게 꼭 있어야 사진이 보임)
    location /media/ {
        alias /home/ubuntu/2535cjzok/media/;
    }

    # 그 외 전부(정적파일 포함, whitenoise가 처리)는 Docker 컨테이너(gunicorn)로 넘긴다.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
