<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}2535 취종지외카{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2/dist/tabler-icons.min.css">
    <style>
        :root {
            --brand-blue: #2B3FE0;
            --brand-pink: #FBD9E8;
            --bg-page: #F5F2EA;
            --text-primary: #1a1a1a;
            --text-secondary: #8a8a86;
            --text-muted: #b3b1a8;
            --border: #e6e3da;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #e5e2d8;
            display: flex;
            justify-content: center;
        }
        .app-shell {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            background: var(--bg-page);
            display: flex;
            flex-direction: column;
        }
        .app-header {
            background: var(--brand-blue);
            padding: 14px 16px 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-badge {
            width: 30px; height: 30px; border-radius: 8px;
            background: var(--brand-blue); border: 1.5px solid var(--brand-pink);
            display: flex; align-items: center; justify-content: center;
            font-size: 7px; font-weight: 500; color: var(--brand-pink);
            line-height: 1.1; text-align: center;
        }
        .header-title { color: var(--brand-pink); font-size: 17px; font-weight: 500; flex: 1; }
        .app-content { flex: 1; padding: 14px; }

        /* 공통 컴포넌트 - 매칭/대화/MY/조건설정 등 앞으로 만들 화면에서 계속 재사용 */
        .card {
            background: #fff; border: 0.5px solid var(--border);
            border-radius: 12px; padding: 10px 12px;
        }
        .list-item { display: flex; align-items: center; gap: 10px; }
        .avatar { width: 44px; height: 44px; border-radius: 10px; background: var(--brand-pink); flex-shrink: 0; }
        .avatar.round { border-radius: 50%; }
        .section-title { font-size: 13px; font-weight: 500; color: var(--text-secondary); margin: 0 0 8px 2px; }
        .chip {
            display: inline-block; font-size: 12px; padding: 6px 12px; border-radius: 14px;
            background: #fff; border: 0.5px solid #d8d5cb; color: var(--text-secondary);
        }
        .chip.selected { background: var(--brand-blue); border-color: var(--brand-blue); color: var(--brand-pink); }
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 8px; }
        .badge-success { color: #0F6E56; background: #E1F5EE; }
        .badge-warning { color: #854F0B; background: #FAEEDA; }
        .btn-primary {
            width: 100%; background: var(--brand-blue); color: var(--brand-pink);
            border: none; border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 500;
        }
        .btn-primary:disabled { opacity: 0.5; }
        .btn-liked { background: var(--brand-pink); color: var(--brand-blue); }
        p, h1, h2, h3 { color: var(--text-primary); }
        a { color: var(--brand-blue); }

        form p { margin: 0 0 12px; }
        form label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
        form input[type=text], form input[type=number], form select, form textarea {
            width: 100%; padding: 9px 10px; border-radius: 10px; border: 0.5px solid var(--border);
            font-size: 13px; background: #fff; color: var(--text-primary);
        }
        form input[type=file] { font-size: 12px; }
        .errorlist { color: #A32D2D; font-size: 12px; padding-left: 0; list-style: none; margin: 2px 0 0; }

        .tab-bar {
            display: flex; border-top: 0.5px solid var(--border); background: #fff; padding: 8px 0 16px;
        }
        .tab-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px;
            text-decoration: none; color: var(--text-muted); font-size: 10px;
        }
        .tab-item i { font-size: 20px; }
        .tab-item.active { color: var(--brand-blue); font-weight: 500; }
        .tab-item.active i { color: var(--brand-blue); }
    </style>
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="app-shell">
    <header class="app-header">
        <div class="logo-badge">2535<br>cjzok</div>
        <span class="header-title">{% block header_title %}2535 취종지외카{% endblock %}</span>
        {% block header_right %}{% endblock %}
    </header>

    <main class="app-content">
        {% block content %}{% endblock %}
    </main>

    {% block bottom_nav %}
    {% if user.is_authenticated and user.is_approved %}
    <nav class="tab-bar">
        <a href="{% url 'home' %}" class="tab-item {% if active_tab == 'matching' %}active{% endif %}">
            <i class="ti ti-heart" aria-hidden="true"></i>매칭
        </a>
        <a href="#" class="tab-item {% if active_tab == 'chat' %}active{% endif %}">
            <i class="ti ti-message-circle" aria-hidden="true"></i>대화
        </a>
        <a href="#" class="tab-item {% if active_tab == 'my' %}active{% endif %}">
            <i class="ti ti-user" aria-hidden="true"></i>MY
        </a>
    </nav>
    {% endif %}
    {% endblock %}
</div>
</body>
</html>
