{% extends "accounts/base.html" %}

{% block header_title %}프로필 등록{% endblock %}

{% block content %}
<div class="card" style="margin-bottom:12px;">
    <p style="font-size:13px; color:var(--text-secondary); margin:0;">
        얼굴/전신 사진과 기본 정보를 입력하면 관리자 심사 후 3일 이내로 승인 여부를 안내해줘.
    </p>
</div>

<div class="card">
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary" style="margin-top:8px;">제출하기</button>
    </form>
</div>
{% endblock %}
